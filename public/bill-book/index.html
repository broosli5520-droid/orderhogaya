<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shams Bill Book — شمس بل بک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ee; --card:#fff; --ink:#2b2118; --muted:#76665a; --line:#e6dbcd;
  --brand:#c55a11; --brand-d:#9c4409; --soft:#fde9db; --soft2:#fff6ef;
  --green:#1e7d43; --green-s:#dcf3e5; --red:#b3261e; --red-s:#fbe0dd; --blue:#1d5fa8; --blue-s:#e1edfa;
  --ur:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Urdu Typesetting","Alvi Nastaleeq",serif;
  --en:"Lato","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--ur);font-size:15px;line-height:2.05}
body.lang-en{font-family:var(--en);line-height:1.5;font-size:15px}
input,select,button,textarea{font-family:inherit;font-size:15px;color:inherit}
.num{font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
svg{width:18px;height:18px;vertical-align:middle;flex:none}

/* header */
header{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:#fff3;display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:18px;border:2px solid #fff8}
header h1{margin:0;font-size:22px;line-height:1.8}
body.lang-en header h1{line-height:1.3}
header .sub{font-size:12px;opacity:.9;font-family:var(--en)}
.hright{margin-inline-start:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shopname{font-weight:700}
.langsw{display:flex;background:#fff3;border-radius:999px;padding:2px}
.langsw button{border:0;background:none;color:#fff;padding:2px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.langsw button.on{background:#fff;color:var(--brand);font-weight:700}

/* nav */
nav{display:flex;gap:4px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:20}
nav button{display:flex;align-items:center;gap:6px;border:0;background:none;border-radius:10px;padding:4px 12px;cursor:pointer;white-space:nowrap;color:var(--muted)}
nav button:hover{background:var(--soft2)}
nav button.on{background:var(--soft);color:var(--brand);font-weight:700}
nav .badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-family:var(--en);line-height:1.6}

main{max-width:1200px;margin:0 auto;padding:14px 16px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{margin:0;font-size:17px;color:var(--brand);display:flex;align-items:center;gap:8px}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-family:var(--en);font-size:14px;flex:none}
.help{color:var(--muted);font-size:13px;margin:2px 0 10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.pos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
@media(max-width:860px){.pos{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:5px 10px;background:#fff}
input:focus,select:focus{outline:2px solid #f4b183;border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:6px 16px;cursor:pointer;font-weight:700}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);font-weight:400}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.wa{background:#1f9d55}
.btn.sm{padding:2px 10px;font-size:13px;font-weight:400;border-radius:8px}
.btn.xl{padding:10px 18px;font-size:16px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.f1{flex:1;min-width:110px}.f2{flex:2;min-width:160px}
.seg{display:flex;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:4px 10px;border-radius:9px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:0 1px 3px #0001}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;max-height:330px;overflow:auto;padding:2px}
.tile{border:1px solid var(--line);background:var(--soft2);border-radius:12px;padding:6px 8px;cursor:pointer;text-align:start;position:relative}
.tile:hover{border-color:var(--brand);background:var(--soft)}
.tile b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .r{font-family:var(--en);font-size:13px;color:var(--brand)}
.tile .q{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--brand);color:#fff;border-radius:999px;font-family:var(--en);font-size:12px;padding:0 7px;line-height:1.7}
.tile.low{border-color:var(--red)}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:start;vertical-align:middle}
th{background:var(--soft);font-size:13px;font-weight:700;white-space:nowrap}
td input{padding:2px 6px;min-width:64px}
.qty{display:flex;align-items:center;gap:3px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:var(--en);font-size:16px;line-height:1}
.qty input{width:70px;text-align:center}
.amtcell input{width:100px;font-weight:700}
.tag{display:inline-block;padding:0 10px;border-radius:999px;font-size:12px;white-space:nowrap}
.tag.g{background:var(--green-s);color:var(--green)}.tag.r{background:var(--red-s);color:var(--red)}.tag.b{background:var(--blue-s);color:var(--blue)}
.totbox{background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0}
.trow .v{font-family:var(--en);font-weight:700;font-size:18px}
.trow.big .v{font-size:28px;color:var(--brand)}
.trow input{max-width:150px}
.stat{background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat .v{font-family:var(--en);font-size:22px;font-weight:700;color:var(--brand)}
.stat.g .v{color:var(--green)}.stat.r .v{color:var(--red)}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:16px;font-size:14px}
.scroll{overflow-x:auto}
.hide{display:none!important}
.steps li{margin-bottom:8px}
.callout{background:var(--blue-s);border-radius:10px;padding:8px 12px;font-size:14px}
#toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:#2b2118;color:#fff;padding:6px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
dialog{border:0;border-radius:14px;padding:16px;max-width:420px;width:92%}
dialog::backdrop{background:#0006}
#mbar{display:none}
@media(max-width:860px){#mbar.show{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--brand);color:#fff;padding:8px 16px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -2px 8px #0002}
 #mbar .v{font-family:var(--en);font-size:20px;font-weight:700}#mbar button{background:#fff;color:var(--brand);border:0;border-radius:10px;padding:4px 14px;font-weight:700;cursor:pointer}}
footer{text-align:center;font-family:var(--en);font-size:12px;color:var(--muted);padding:10px}

/* receipt */
#receipt{display:none}
.rc{color:#000;background:#fff}
.rc h3{margin:0;text-align:center}
.rc .c{text-align:center}
.rc table th{background:none;border-bottom:1px dashed #000;padding:1px 3px}
.rc table td{border-bottom:1px dotted #aaa;padding:1px 3px}
.rc .ln{border-top:1px dashed #000;margin:4px 0}
.rc .tr{display:flex;justify-content:space-between}
@media print{
  body{background:#fff}
  header,nav,main,footer,#toast,dialog{display:none!important}
  #receipt{display:block}
  body.p80 #receipt{width:72mm;margin:0 auto;font-size:12px}
  body.p80 .rc h3{font-size:16px}
  body.pA4 #receipt{width:180mm;margin:0 auto;font-size:14px}
  body.pA4 .rc h3{font-size:22px}
  @page{margin:5mm}
}
</style>
</head>

<header>
  <div class="logo">SB</div>
  <div>
    <h1 data-t="appName">شمس بل بک</h1>
    <div class="sub">Shams Bill Book</div>
  </div>
  <div class="hright">
    <span class="shopname" id="hdrShop"></span>
    <div class="langsw" id="langsw"><button data-l="ur">اردو</button><button data-l="en">English</button></div>
  </div>
</header>

<nav id="nav">
  <button data-tab="bill" class="on"><svg><use href="#i-bill"/></svg><span data-t="tBill"></span></button>
  <button data-tab="cust"><svg><use href="#i-users"/></svg><span data-t="tCust"></span><span class="badge hide" id="dueBadge"></span></button>
  <button data-tab="items"><svg><use href="#i-tag"/></svg><span data-t="tItems"></span></button>
  <button data-tab="exp"><svg><use href="#i-wallet"/></svg><span data-t="tExp"></span></button>
  <button data-tab="hist"><svg><use href="#i-history"/></svg><span data-t="tHist"></span></button>
  <button data-tab="rep"><svg><use href="#i-chart"/></svg><span data-t="tRep"></span></button>
  <button data-tab="set"><svg><use href="#i-gear"/></svg><span data-t="tSet"></span></button>
  <button data-tab="help"><svg><use href="#i-help"/></svg><span data-t="tHelp"></span></button>
</nav>

<main>
<!-- ================= NEW BILL ================= -->
<section id="tab-bill">
 <div class="pos">
  <div>
    <div class="card">
      <h2><span class="step">1</span><span data-t="s1"></span></h2>
      <p class="help" data-t="s1h"></p>
      <input id="tileSearch" data-tp="searchItem">
      <div class="tiles" id="tiles" style="margin-top:8px"></div>
      <p class="empty hide" id="tilesEmpty" data-t="noItemsYet"></p>
    </div>
    <div class="card">
      <h2><span class="step">+</span><span data-t="custom"></span></h2>
      <p class="help" data-t="customH"></p>
      <div class="seg" id="modeSeg"><button data-m="amt" class="on" data-t="modeAmt"></button><button data-m="qty" data-t="modeQty"></button></div>
      <div class="row" style="margin-top:8px">
        <div class="f2"><label data-t="itemName"></label><input id="cItem" list="itemList" data-tp="itemNamePh"></div>
        <div class="f1 qtyOnly hide"><label data-t="qty"></label><input id="cQty" class="num" type="number" step="any" min="0" value="1"></div>
        <div class="f1 qtyOnly hide"><label data-t="rate"></label><input id="cRate" class="num" type="number" step="any" min="0"></div>
        <div class="f1 amtOnly"><label data-t="amount"></label><input id="cAmt" class="num" type="number" step="any" min="0" data-tp="amountPh"></div>
        <button class="btn" id="cAdd"><svg><use href="#i-plus"/></svg><span data-t="add"></span></button>
      </div>
      <p class="muted" id="cHint"></p>
    </div>
  </div>

  <div>
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2><span class="step">2</span><span data-t="s2"></span></h2>
        <span class="muted"><span data-t="billNo"></span>: <b class="num" id="billNo"></b></span>
      </div>
      <div class="grid g2" style="margin-top:6px">
        <div><label data-t="custName"></label><input id="bName" list="custList" data-tp="optional"></div>
        <div><label data-t="phone"></label><input id="bPhone" class="num" inputmode="tel" placeholder="03xx-xxxxxxx"></div>
      </div>
      <p class="muted hide" id="custDueNote"></p>
      <div class="scroll" style="margin-top:8px">
        <table id="lines"><thead><tr><th data-t="item"></th><th data-t="qty"></th><th data-t="rate"></th><th data-t="amount"></th><th></th></tr></thead><tbody></tbody></table>
      </div>
      <p class="empty" id="linesEmpty" data-t="noLines"></p>
    </div>

    <div class="card">
      <h2><span class="step">3</span><span data-t="s3"></span></h2>
      <div class="totbox" style="margin-top:8px">
        <div class="trow"><span data-t="subtotal"></span><span class="v num" id="tSub">0</span></div>
        <div class="trow"><span data-t="discount"></span>
          <span class="row" style="flex-wrap:nowrap;align-items:center"><input id="disc" class="num" type="number" step="any" min="0" value="0" style="width:90px">
          <span class="seg" id="discSeg" style="padding:2px"><button data-d="rs" class="on" style="padding:0 8px">Rs</button><button data-d="pc" style="padding:0 8px">%</button></span></span></div>
        <div class="trow big"><b data-t="payable"></b><span class="v num" id="tNet">0</span></div>
      </div>
      <label style="margin-top:10px" data-t="method"></label>
      <div class="chips" id="methods"></div>
      <div id="paidWrap">
        <label style="margin-top:10px" data-t="received"></label>
        <div class="row" style="align-items:center">
          <input id="paid" class="num f1" type="number" step="any" min="0" data-tp="receivedPh">
          <div class="chips" id="quickPaid"></div>
        </div>
      </div>
      <div class="trow" style="margin-top:6px"><b id="balLbl"></b><span class="v num" id="tBal">0</span></div>
      <div class="grid g2" style="margin-top:12px">
        <button class="btn green xl" id="saveP"><svg><use href="#i-print"/></svg><span data-t="savePrint"></span></button>
        <button class="btn wa xl" id="saveW"><svg><use href="#i-wa"/></svg><span data-t="saveWa"></span></button>
        <button class="btn ghost" id="saveOnly"><svg><use href="#i-check"/></svg><span data-t="saveOnly"></span></button>
        <button class="btn ghost" id="newBill"><span data-t="newBill"></span></button>
      </div>
    </div>
  </div>
 </div>
</section>

<!-- ================= CUSTOMERS ================= -->
<section id="tab-cust" class="hide">
  <div class="grid g3" id="custStats"></div>
  <div class="card" style="margin-top:14px">
    <h2 data-t="custTitle"></h2>
    <p class="help" data-t="custH"></p>
    <div class="row">
      <div class="f2"><label data-t="custName"></label><input id="nName"></div>
      <div class="f1"><label data-t="phone"></label><input id="nPhone" class="num"></div>
      <div class="f1"><label data-t="oldDue"></label><input id="nOpen" class="num" type="number" step="any" min="0" data-tp="optional"></div>
      <button class="btn" id="nAdd"><svg><use href="#i-plus"/></svg><span data-t="addCust"></span></button>
    </div>
    <div class="row" style="margin-top:10px"><div class="f2"><input id="cSearch" data-tp="search"></div>
      <div class="seg" id="cFilter"><button data-f="due" class="on" data-t="onlyDue"></button><button data-f="all" data-t="all"></button></div></div>
    <div class="scroll" style="margin-top:8px"><table id="custTbl"><thead><tr><th data-t="custName"></th><th data-t="phone"></th><th data-t="due"></th><th data-t="lastBill"></th><th></th></tr></thead><tbody></tbody></table></div>
  </div>
</section>

<!-- ================= ITEMS ================= -->
<section id="tab-items" class="hide">
  <div class="card">
    <h2 data-t="itemsTitle"></h2>
    <p class="help" data-t="itemsH"></p>
    <div class="row">

var MKEY=["cash","jazz","easy","bank","credit"];
var CKEY=["util","rent","salary","stock","food","transport","other"];

/* ======================= DATA ======================= */
var KEY="shamsBillBook.v1";
var db=fresh();
function fresh(){return{v:2,settings:{name:"",phone:"",addr:"",foot:"",cur:"Rs",lang:"ur",rlang:"ur",paper:"p80"},items:[],customers:[],bills:[],expenses:[],nextNo:1,lastBackup:null}}
function load(){try{var s=localStorage.getItem(KEY);if(!s)return;var d=JSON.parse(s);var f=fresh();
  db=Object.assign(f,d);db.settings=Object.assign(f.settings,d.settings||{});db.customers=db.customers||[];db.expenses=db.expenses||[];
  db.bills.forEach(migrateBill);db.v=2}catch(e){}}
function migrateBill(b){ // v1 -> v2
  b.lines.forEach(function(l){if(l.amt==null)l.amt=r2(l.qty*l.rate)});
  if(b.paid0==null){var p=0;(b.payments||[]).forEach(function(x){p+=x.amount});b.paid0=r2((b.paid||0)-p)}
  if(!b.mk){var i=TX.ur.methods.indexOf(b.method);b.mk=MKEY[i>=0?i:0]}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast("!! Storage error — take a backup");return false}}

/* ======================= UTIL ======================= */
var $=function(id){return document.getElementById(id)};
function L(){return db.settings.lang||"ur"}
function t(k){var v=TX[L()][k];return v==null?k:v}
function tr(k){var v=TX[db.settings.rlang||"ur"][k];return v==null?k:v}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(v){v=parseFloat(v);return isFinite(v)?v:0}
function r2(v){return Math.round((v+Number.EPSILON)*100)/100}
function fmt(v){return Number(r2(v)).toLocaleString("en-US",{maximumFractionDigits:2})}
function fq(v){return Number(Math.round(v*1000)/1000).toLocaleString("en-US",{maximumFractionDigits:3})}
function money(v){return (db.settings.cur||"Rs")+" "+fmt(v)}
function pad(x){return x<10?"0"+x:""+x}
function day(d){d=d instanceof Date?d:new Date(d);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function sd(iso){var d=new Date(iso);return pad(d.getDate())+"-"+MON[d.getMonth()]+"-"+d.getFullYear()}
function sdt(iso){var d=new Date(iso);return sd(iso)+" "+pad(d.getHours()%12||12)+":"+pad(d.getMinutes())+(d.getHours()<12?" AM":" PM")}
function toast(m){var el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},2300)}
function ask(title,msg,val,cb){$("dlgT").textContent=title;$("dlgM").textContent=msg;$("dlgI").value=val;var d=$("dlg");
  d.onclose=function(){if(d.returnValue==="ok")cb(n($("dlgI").value))};d.returnValue="";d.showModal();setTimeout(function(){$("dlgI").select()},50)}
function mname(k){return t("methods")[MKEY.indexOf(k)]}
function cname(k){return t("cats")[CKEY.indexOf(k)]}
function findItem(name){name=(name||"").trim().toLowerCase();for(var i=0;i<db.items.length;i++)if(db.items[i].name.toLowerCase()===name)return db.items[i];return null}
function findCust(name){name=(name||"").trim();for(var i=0;i<db.customers.length;i++)if(db.customers[i].name===name)return db.customers[i];return null}
function custDue(name){var s=0;db.bills.forEach(function(b){if(b.cName===name)s+=b.due||0});var c=findCust(name);if(c)s+=c.openDue||0;return r2(s)}

/* ======================= LANGUAGE ======================= */
function applyLang(){
  var l=L();document.documentElement.lang=l;document.documentElement.dir=l==="ur"?"rtl":"ltr";
  document.body.classList.toggle("lang-en",l==="en");
  [].forEach.call(document.querySelectorAll("[data-t]"),function(el){el.textContent=t(el.dataset.t)});
  [].forEach.call(document.querySelectorAll("[data-tp]"),function(el){el.placeholder=t(el.dataset.tp)});
  [].forEach.call($("langsw").children,function(b){b.classList.toggle("on",b.dataset.l===l)});
  $("helpBox").innerHTML=t("help");
  renderAll();
}
$("langsw").onclick=function(e){var b=e.target.closest("button");if(!b)return;db.settings.lang=b.dataset.l;save();applyLang()};

/* ======================= TABS ======================= */
var curTab="bill";
$("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;curTab=b.dataset.tab;
  [].forEach.call($("nav").children,function(x){x.classList.toggle("on",x===b)});
  ["bill","cust","items","exp","hist","rep","set","help"].forEach(function(k){$("tab-"+k).classList.toggle("hide",k!==curTab)});
  renderAll();if(curTab!=="bill")$("mbar").classList.remove("show");window.scrollTo(0,0)};
$("mbarGo").onclick=function(){$("lines").scrollIntoView({behavior:"smooth",block:"start"})};
function renderAll(){renderHeader();renderLists();
  if(curTab==="bill"){renderTiles();renderLines();renderMethods();renderCustom()}
  if(curTab==="cust")renderCust();if(curTab==="items")renderItems();if(curTab==="exp")renderExp();
  if(curTab==="hist")renderHist();if(curTab==="rep")renderRep();if(curTab==="set")fillSet()}
function renderHeader(){$("hdrShop").textContent=db.settings.name||"";$("billNo").textContent=db.nextNo;
  var c=0;dueMap(function(nm,a){if(a>0)c++});$("dueBadge").textContent=c;$("dueBadge").classList.toggle("hide",!c)}
function dueMap(fn){var m={};db.customers.forEach(function(c){m[c.name]=(m[c.name]||0)+(c.openDue||0)});db.bills.forEach(function(b){if(b.cName)m[b.cName]=(m[b.cName]||0)+(b.due||0)});Object.keys(m).forEach(function(k){fn(k,r2(m[k]))});return m}
function renderLists(){
  $("itemList").innerHTML=db.items.map(function(i){return '<option value="'+esc(i.name)+'">'}).join("");
  var names={};db.customers.forEach(function(c){names[c.name]=1});db.bills.forEach(function(b){if(b.cName)names[b.cName]=1});
  $("custList").innerHTML=Object.keys(names).map(function(k){return '<option value="'+esc(k)+'">'}).join("");
}

/* ======================= BILL ======================= */
var cur={lines:[],method:"cash",discMode:"rs"};
var mode="amt";
function renderTiles(){
  var q=$("tileSearch").value.trim().toLowerCase(),qmap={};
  cur.lines.forEach(function(l){qmap[l.name]=(qmap[l.name]||0)+(l.qty||0)});
  var list=db.items.filter(function(i){return !q||i.name.toLowerCase().indexOf(q)>=0});
  $("tiles").innerHTML=list.map(function(i){var idx=db.items.indexOf(i),low=i.stock!=null&&i.min!=null&&i.stock<=i.min;
    return '<button class="tile'+(low?' low':'')+'" data-ti="'+idx+'"><b>'+esc(i.name)+'</b><span class="r">'+fmt(i.rate)+(i.unit?' / '+esc(i.unit):'')+'</span>'+(qmap[i.name]?'<span class="q">'+fq(qmap[i.name])+'</span>':'')+'</button>'}).join("");
  $("tilesEmpty").classList.toggle("hide",db.items.length>0);
}
$("tileSearch").oninput=renderTiles;
$("tileSearch").onkeydown=function(e){if(e.key==="Enter"){var f=$("tiles").querySelector(".tile");if(f){f.click();this.select()}}};
$("tiles").onclick=function(e){var b=e.target.closest(".tile");if(!b)return;var it=db.items[+b.dataset.ti];
  var ex=cur.lines.filter(function(l){return l.name===it.name&&!l.byAmt})[0];
  if(ex){ex.qty=r2(ex.qty+1);ex.amt=r2(ex.qty*ex.rate)}else cur.lines.push({name:it.name,unit:it.unit||"",qty:1,rate:it.rate,amt:it.rate,byAmt:false});
  renderLines();renderTiles()};
$("modeSeg").onclick=function(e){var b=e.target.closest("button");if(!b)return;mode=b.dataset.m;renderCustom();(mode==="amt"?$("cAmt"):$("cQty")).focus()};
function renderCustom(){[].forEach.call($("modeSeg").children,function(b){b.classList.toggle("on",b.dataset.m===mode)});
  [].forEach.call(document.querySelectorAll(".qtyOnly"),function(x){x.classList.toggle("hide",mode!=="qty")});
  [].forEach.call(document.querySelectorAll(".amtOnly"),function(x){x.classList.toggle("hide",mode!=="amt")});hint()}
function hint(){var it=findItem($("cItem").value),h="";
  if(it&&mode==="amt"&&n($("cAmt").value)>0&&it.rate>0)h=fmt(n($("cAmt").value))+" ÷ "+fmt(it.rate)+" = "+fq(n($("cAmt").value)/it.rate)+" "+(it.unit||"");
  else if(it)h=t("rate")+": "+fmt(it.rate)+(it.unit?" / "+it.unit:"");
  if(mode==="qty"&&n($("cQty").value)>0&&n($("cRate").value)>0)h=fq(n($("cQty").value))+" × "+fmt(n($("cRate").value))+" = "+fmt(n($("cQty").value)*n($("cRate").value));
  $("cHint").textContent=h}
$("cItem").oninput=function(){var it=findItem(this.value);if(it&&mode==="qty")$("cRate").value=it.rate;hint()};
["cAmt","cQty","cRate"].forEach(function(id){$(id).oninput=hint;$(id).onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();addCustom()}}});
$("cItem").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();(mode==="amt"?$("cAmt"):$("cQty")).focus()}};
$("cAdd").onclick=addCustom;
function addCustom(){
  var name=$("cItem").value.trim()||t("misc"),it=findItem(name);
  if(it)name=it.name;
  if(mode==="amt"){var a=n($("cAmt").value);if(a<=0){toast(t("needAmt"));$("cAmt").focus();return}
    var rate=it&&it.rate>0?it.rate:a;cur.lines.push({name:name,unit:it?it.unit||"":"",qty:r2(a/rate*1000)/1000,rate:rate,amt:r2(a),byAmt:true})}
  else{var q=n($("cQty").value),rt=n($("cRate").value);if(q<=0||rt<=0){toast(t("needItem"));return}
    cur.lines.push({name:name,unit:it?it.unit||"":"",qty:q,rate:rt,amt:r2(q*rt),byAmt:false})}
  $("cItem").value="";$("cAmt").value="";$("cQty").value=1;$("cRate").value="";$("cHint").textContent="";$("cItem").focus();
  renderLines();renderTiles()}

function renderLines(){
  var tb=$("lines").tBodies[0];
  tb.innerHTML=cur.lines.map(function(l,i){return '<tr><td><b>'+esc(l.name)+'</b>'+(l.unit?' <span class="muted">('+esc(l.unit)+')</span>':'')+'</td>'+
    '<td><div class="qty"><button data-m="'+i+'">−</button><input class="num" type="number" step="any" min="0" data-q="'+i+'" value="'+fq(l.qty).replace(/,/g,"")+'"><button data-p="'+i+'">+</button></div></td>'+
    '<td><input class="num" style="width:80px" type="number" step="any" min="0" data-r="'+i+'" value="'+l.rate+'"></td>'+
    '<td class="amtcell"><input class="num" type="number" step="any" min="0" data-a="'+i+'" value="'+l.amt+'"></td>'+
    '<td><button class="btn red sm" data-x="'+i+'" title="×"><svg><use href="#i-trash"/></svg></button></td></tr>'}).join("");
  $("linesEmpty").classList.toggle("hide",cur.lines.length>0);
  renderTotals();
}
$("lines").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.x!=null){cur.lines.splice(+d.x,1)}
  else{var l=cur.lines[+(d.m!=null?d.m:d.p)];if(!l)return;l.qty=r2(Math.max(0,l.qty+(d.m!=null?-1:1)));if(l.qty===0){cur.lines.splice(+(d.m!=null?d.m:d.p),1)}else{l.amt=r2(l.qty*l.rate);l.byAmt=false}}
  renderLines();renderTiles()});
$("lines").addEventListener("input",function(e){var x=e.target,d=x.dataset,i,l;
  if(d.q!=null){l=cur.lines[+d.q];l.qty=n(x.value);l.amt=r2(l.qty*l.rate);l.byAmt=false;x.closest("tr").querySelector("[data-a]").value=l.amt}
  else if(d.r!=null){l=cur.lines[+d.r];l.rate=n(x.value);if(l.byAmt&&l.rate>0){l.qty=r2(l.amt/l.rate*1000)/1000;x.closest("tr").querySelector("[data-q]").value=l.qty}else{l.amt=r2(l.qty*l.rate);x.closest("tr").querySelector("[data-a]").value=l.amt}}
  else if(d.a!=null){l=cur.lines[+d.a];l.amt=n(x.value);l.byAmt=true;if(l.rate>0){l.qty=r2(l.amt/l.rate*1000)/1000;x.closest("tr").querySelector("[data-q]").value=l.qty}}
  else return;renderTotals()});
$("lines").addEventListener("change",function(){renderTiles()});

function totals(){var sub=0;cur.lines.forEach(function(l){sub+=l.amt});sub=r2(sub);
  var dv=n($("disc").value),disc=cur.discMode==="pc"?r2(sub*Math.min(dv,100)/100):Math.min(dv,sub);var net=r2(sub-disc);
  var pv=$("paid").value,paid=cur.method==="credit"?(pv===""?0:n(pv)):(pv===""?net:n(pv));
  return{sub:sub,disc:r2(disc),net:net,paid:r2(paid),bal:r2(paid-net)}}
function renderTotals(){var x=totals();$("mbar").classList.toggle("show",curTab==="bill"&&cur.lines.length>0);$("mbarN").textContent=cur.lines.length+" "+t("itemsN");$("mbarT").textContent=money(x.net);$("tSub").textContent=fmt(x.sub);$("tNet").textContent=money(x.net);
  if(x.bal<0){$("balLbl").textContent=t("dueLbl");$("tBal").style.color="var(--red)";$("tBal").textContent=fmt(-x.bal)}
  else{$("balLbl").textContent=t("change");$("tBal").style.color="var(--green)";$("tBal").textContent=fmt(x.bal)}
  var qs=[["exact",x.net]];[100,500,1000,5000].forEach(function(v){if(v>=x.net*0.5||v>=1000)qs.push([String(v),v])});
  $("quickPaid").innerHTML=qs.slice(0,5).map(function(q){return '<button class="chip num" data-qp="'+q[1]+'">'+(q[0]==="exact"?t("exact"):q[0])+'</button>'}).join("");}
$("quickPaid").onclick=function(e){var b=e.target.closest("[data-qp]");if(!b)return;$("paid").value=b.dataset.qp;renderTotals()};
$("disc").oninput=renderTotals;$("paid").oninput=renderTotals;
$("discSeg").onclick=function(e){var b=e.target.closest("button");if(!b)return;cur.discMode=b.dataset.d;[].forEach.call(this.children,function(x){x.classList.toggle("on",x===b)});renderTotals()};
function renderMethods(){$("methods").innerHTML=MKEY.map(function(k){return '<button class="chip'+(cur.method===k?' on':'')+'" data-mk="'+k+'">'+mname(k)+'</button>'}).join("")}
$("methods").onclick=function(e){var b=e.target.closest("[data-mk]");if(!b)return;cur.method=b.dataset.mk;if(cur.method==="credit")$("paid").value="";renderMethods();renderTotals()};
$("bName").addEventListener("change",function(){var nm=this.value.trim(),c=findCust(nm);
  if(!$("bPhone").value){if(c&&c.phone)$("bPhone").value=c.phone;else for(var i=db.bills.length-1;i>=0;i--)if(db.bills[i].cName===nm&&db.bills[i].cPhone){$("bPhone").value=db.bills[i].cPhone;break}}
  var d=custDue(nm);$("custDueNote").classList.toggle("hide",!(d>0));$("custDueNote").textContent=t("custDue")+money(d)});
function clearBill(){cur={lines:[],method:"cash",discMode:"rs"};$("bName").value="";$("bPhone").value="";$("disc").value=0;$("paid").value="";
  [].forEach.call($("discSeg").children,function(x){x.classList.toggle("on",x.dataset.d==="rs")});$("custDueNote").classList.add("hide");
  renderLines();renderTiles();renderMethods();renderHeader()}
$("newBill").onclick=function(){if(!cur.lines.length||confirm(t("confirmNew")))clearBill()};

function commit(){
  if(!cur.lines.length){toast(t("needItem"));return null}
  var x=totals(),nm=$("bName").value.trim(),ph=$("bPhone").value.trim();
  var due=x.bal<0?-x.bal:0;
  if(due>0&&!nm){toast(t("needName"));$("bName").focus();return null}
  var prev=nm?custDue(nm):0;
  var b={no:db.nextNo,date:new Date().toISOString(),cName:nm,cPhone:ph,lines:cur.lines.map(function(l){return{name:l.name,unit:l.unit,qty:l.qty,rate:l.rate,amt:l.amt}}),
    sub:x.sub,disc:x.disc,net:x.net,paid0:Math.min(x.paid,x.net),change:x.bal>0?x.bal:0,due:r2(due),mk:cur.method==="credit"&&x.paid>0?"cash":cur.method,payments:[],prevDue:prev};
  db.bills.push(b);db.nextNo++;
  if(nm&&!findCust(nm))db.customers.push({name:nm,phone:ph,openDue:0});
  else if(nm&&ph){var c=findCust(nm);if(!c.phone)c.phone=ph}
  b.lines.forEach(function(l){var it=findItem(l.name);if(it){if(it.stock!=null)it.stock=r2(it.stock-l.qty)}else if(l.name!==t("misc")&&l.name!==TX.ur.misc&&l.name!==TX.en.misc)db.items.push({name:l.name,unit:l.unit,rate:l.rate,stock:null,min:null})});
  save();return b}
$("saveP").onclick=function(){var b=commit();if(!b)return;printBill(b);clearBill();toast(t("saved")+" — #"+b.no)};
$("saveW").onclick=function(){var b=commit();if(!b)return;sendWA(b.cPhone,billText(b));clearBill();toast(t("saved")+" — #"+b.no)};
$("saveOnly").onclick=function(){var b=commit();if(!b)return;clearBill();toast(t("saved")+" — #"+b.no)};

function billText(b){var s=db.settings,o=[];
  o.push("*"+(s.name||"Shams Bill Book")+"*");if(s.phone)o.push(s.phone);
  o.push(tr("rBill")+": "+b.no+" | "+sdt(b.date));if(b.cName)o.push(tr("rCust")+": "+b.cName);
  o.push("--------------------");
  b.lines.forEach(function(l){o.push(l.name+": "+fq(l.qty)+" × "+fmt(l.rate)+" = "+fmt(l.amt))});
  o.push("--------------------");
  if(b.disc)o.push(tr("rDisc")+": "+fmt(b.disc));
  o.push("*"+tr("rNet")+": "+money(b.net)+"*");o.push(tr("rPaid")+": "+money(b.paid0));
  if(b.due)o.push("*"+tr("rDue")+": "+money(b.due)+"*");
  if(b.prevDue>0)o.push(tr("rTotalDue")+": "+money(b.prevDue+b.due));
  o.push(s.foot||tr("rThanks"));return o.join("\n")}
function sendWA(phone,text){var ph=(phone||"").replace(/\D/g,"");if(ph.indexOf("0")===0)ph="92"+ph.slice(1);
  window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(text),"_blank")}

/* ======================= PRINT ======================= */
function printBill(b){var s=db.settings,rl=s.rlang||"ur";
  var rows=b.lines.map(function(l){return '<tr><td>'+esc(l.name)+'</td><td class="num">'+fq(l.qty)+'</td><td class="num">'+fmt(l.rate)+'</td><td class="num">'+fmt(l.amt)+'</td></tr>'}).join("");
  function tr2(k,v,bold){return '<div class="tr"'+(bold?' style="font-weight:700"':'')+'><span>'+tr(k)+'</span><span class="num">'+v+'</span></div>'}
  $("receipt").innerHTML='<div class="rc" dir="'+(rl==="ur"?"rtl":"ltr")+'" style="font-family:'+(rl==="ur"?"var(--ur);line-height:2":"var(--en);line-height:1.4")+'">'+
    '<h3>'+esc(s.name||"Shams Bill Book")+'</h3>'+(s.addr?'<div class="c">'+esc(s.addr)+'</div>':'')+(s.phone?'<div class="c num">'+esc(s.phone)+'</div>':'')+
    '<div class="ln"></div><div class="tr"><span>'+tr("rBill")+': <b class="num">'+b.no+'</b></span><span class="num">'+sdt(b.date)+'</span></div>'+
    (b.cName?'<div>'+tr("rCust")+': '+esc(b.cName)+(b.cPhone?' — <span class="num">'+esc(b.cPhone)+'</span>':'')+'</div>':'')+

    tr2("rSub",fmt(b.sub))+(b.disc?tr2("rDisc",fmt(b.disc)):'')+tr2("rNet",money(b.net),1)+tr2("rPaid",fmt(b.paid0))+(b.change?tr2("rChange",fmt(b.change)):'')+(b.due?tr2("rDue",fmt(b.due),1):'')+

/* ======================= CUSTOMERS ======================= */
var cFilter="due";
$("cFilter").onclick=function(e){var b=e.target.closest("button");if(!b)return;cFilter=b.dataset.f;[].forEach.call(this.children,function(x){x.classList.toggle("on",x===b)});renderCust()};
$("cSearch").oninput=renderCust;
$("nAdd").onclick=function(){var nm=$("nName").value.trim();if(!nm){$("nName").focus();return}
  var c=findCust(nm);if(c){c.phone=$("nPhone").value.trim()||c.phone;c.openDue=r2((c.openDue||0)+n($("nOpen").value))}
  else db.customers.push({name:nm,phone:$("nPhone").value.trim(),openDue:r2(n($("nOpen").value))});
  save();$("nName").value="";$("nPhone").value="";$("nOpen").value="";renderCust();renderHeader();renderLists()};
function custRows(){var m=dueMap(function(){}),last={},cnt={};db.bills.forEach(function(b){if(b.cName){last[b.cName]=b.date;cnt[b.cName]=(cnt[b.cName]||0)+1}});
  var names=Object.keys(m);db.customers.forEach(function(c){if(names.indexOf(c.name)<0)names.push(c.name)});
  return names.map(function(nm){var c=findCust(nm);return{name:nm,phone:c&&c.phone||"",due:r2(m[nm]||0),last:last[nm],cnt:cnt[nm]||0}})}
function renderCust(){var q=$("cSearch").value.trim(),rows=custRows(),tot=0,dc=0;
  rows.forEach(function(r){if(r.due>0){tot+=r.due;dc++}});
  $("custStats").innerHTML='<div class="stat r"><div class="muted">'+t("totalDue")+'</div><div class="v">'+money(tot)+'</div></div><div class="stat"><div class="muted">'+t("dueCusts")+'</div><div class="v">'+dc+'</div></div><div class="stat"><div class="muted">'+t("all")+'</div><div class="v">'+rows.length+'</div></div>';
  rows=rows.filter(function(r){return(cFilter==="all"||r.due>0)&&(!q||r.name.indexOf(q)>=0||r.phone.indexOf(q)>=0)}).sort(function(a,b){return b.due-a.due});
  $("custTbl").tBodies[0].innerHTML=rows.map(function(r){return '<tr><td><b>'+esc(r.name)+'</b> <span class="muted num">('+r.cnt+')</span></td><td class="num">'+esc(r.phone)+'</td><td class="num">'+(r.due>0?'<span class="tag r">'+fmt(r.due)+'</span>':'<span class="tag g">0</span>')+'</td><td class="num">'+(r.last?sd(r.last):"—")+'</td>'+
    '<td style="white-space:nowrap">'+(r.due>0?'<button class="btn green sm" data-rcv="'+esc(r.name)+'">'+t("receive")+'</button> <button class="btn wa sm" data-rem="'+esc(r.name)+'"><svg><use href="#i-wa"/></svg>'+t("remind")+'</button>':'')+'</td></tr>'}).join("")||'<tr><td colspan="5" class="empty">—</td></tr>'}
$("custTbl").onclick=function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.rcv){var nm=b.dataset.rcv,d=custDue(nm);ask(t("recvTitle")+" — "+nm,t("recvMsg")+money(d),d,function(a){receive(nm,Math.min(a,d));renderCust();renderHeader();toast("✓ "+money(a))})}
  if(b.dataset.rem){var nm2=b.dataset.rem,c=findCust(nm2);sendWA(c&&c.phone,t("remindText").replace("{n}",nm2).replace("{s}",db.settings.name||"").replace("{a}",money(custDue(nm2))))}};
function receive(nm,a){if(a<=0)return;var now=new Date().toISOString();var c=findCust(nm);
  if(c&&c.openDue>0){var x=Math.min(c.openDue,a);c.openDue=r2(c.openDue-x);a=r2(a-x);(c.payments=c.payments||[]).push({date:now,amount:x})}
  db.bills.filter(function(b){return b.cName===nm&&b.due>0}).forEach(function(b){if(a<=0)return;var x=Math.min(b.due,a);b.due=r2(b.due-x);a=r2(a-x);b.payments.push({date:now,amount:x})});save()}

  $("itemsTbl").tBodies[0].innerHTML=db.items.map(function(i,k){if(q&&i.name.toLowerCase().indexOf(q)<0)return"";var low=i.stock!=null&&i.min!=null&&i.stock<=i.min;
    return '<tr><td><b>'+esc(i.name)+'</b></td><td>'+esc(i.unit)+'</td><td class="num">'+fmt(i.rate)+'</td><td class="num">'+(i.stock==null?"—":'<span class="tag '+(low?"r":"g")+'">'+fq(i.stock)+'</span>')+'</td><td style="white-space:nowrap"><button class="btn ghost sm" data-ie="'+k+'">'+t("edit")+'</button> <button class="btn red sm" data-id="'+k+'"><svg><use href="#i-trash"/></svg></button></td></tr>'}).join("")||'<tr><td colspan="5" class="empty">'+t("noItemsYet")+'</td></tr>'}
$("itemsTbl").onclick=function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.ie){var i=db.items[+b.dataset.ie];$("iName").value=i.name;$("iUnit").value=i.unit||"";$("iRate").value=i.rate;$("iStock").value=i.stock==null?"":i.stock;$("iMin").value=i.min==null?"":i.min;$("iRate").focus();window.scrollTo(0,0)}
  if(b.dataset.id&&confirm(t("confirmDel"))){db.items.splice(+b.dataset.id,1);save();renderItems();renderLists()}};

/* ======================= EXPENSES ======================= */
var eCat="other";
function renderExp(){if(!$("eDate").value)$("eDate").value=day(new Date());
  $("eCats").innerHTML=CKEY.map(function(k){return '<button class="chip'+(eCat===k?' on':'')+'" data-ck="'+k+'">'+cname(k)+'</button>'}).join("");
  var ym=day(new Date()).slice(0,7),mt=0,tt=0,td=day(new Date());
  var list=db.expenses.slice().sort(function(a,b){return a.date<b.date?1:-1});
  list.forEach(function(x){if(x.date.slice(0,7)===ym)mt+=x.amount;if(x.date===td)tt+=x.amount});
  $("expTbl").tBodies[0].innerHTML=list.slice(0,200).map(function(x){return '<tr><td class="num">'+sd(x.date+"T00:00")+'</td><td>'+esc(x.desc)+'</td><td><span class="tag b">'+cname(x.cat)+'</span></td><td class="num">'+fmt(x.amount)+'</td><td><button class="btn red sm" data-ed="'+x.id+'"><svg><use href="#i-trash"/></svg></button></td></tr>'}).join("")||'<tr><td colspan="5" class="empty">—</td></tr>';
  $("expInfo").innerHTML=t("todayExp")+': <b class="num">'+money(tt)+'</b> · '+t("monthExp")+': <b class="num">'+money(mt)+'</b>'}
$("eCats").onclick=function(e){var b=e.target.closest("[data-ck]");if(!b)return;eCat=b.dataset.ck;renderExp()};
$("eAdd").onclick=function(){var a=n($("eAmt").value);if(a<=0){toast(t("needAmt"));$("eAmt").focus();return}
  db.expenses.push({id:Date.now(),date:$("eDate").value||day(new Date()),desc:$("eDesc").value.trim()||cname(eCat),cat:eCat,amount:r2(a)});save();$("eDesc").value="";$("eAmt").value="";$("eDesc").focus();renderExp();toast("✓")};
$("eAmt").onkeydown=function(e){if(e.key==="Enter")$("eAdd").click()};
$("expTbl").onclick=function(e){var b=e.target.closest("[data-ed]");if(b&&confirm(t("confirmDel"))){db.expenses=db.expenses.filter(function(x){return x.id!==+b.dataset.ed});save();renderExp()}};

/* ======================= HISTORY ======================= */
var hF="all";
$("hFilter").onclick=function(e){var b=e.target.closest("button");if(!b)return;hF=b.dataset.f;[].forEach.call(this.children,function(x){x.classList.toggle("on",x===b)});renderHist()};
["hSearch","hFrom","hTo"].forEach(function(k){$(k).oninput=renderHist});
function renderHist(){var q=$("hSearch").value.trim(),f=$("hFrom").value,to=$("hTo").value,sum=0,due=0;
  var list=db.bills.filter(function(b){var d=day(b.date);if(f&&d<f)return false;if(to&&d>to)return false;if(hF==="paid"&&b.due>0)return false;if(hF==="due"&&!(b.due>0))return false;
    if(q&&String(b.no)!==q&&(b.cName||"").indexOf(q)<0&&(b.cPhone||"").indexOf(q)<0)return false;return true}).reverse();
  list.forEach(function(b){sum+=b.net;due+=b.due||0});
  $("histTbl").tBodies[0].innerHTML=list.slice(0,300).map(function(b){return '<tr><td class="num"><b>'+b.no+'</b></td><td class="num">'+sdt(b.date)+'</td><td>'+esc(b.cName||"—")+'</td><td class="num">'+fmt(b.net)+' <span class="muted">'+mname(b.mk)+'</span></td><td>'+(b.due>0?'<span class="tag r num">'+fmt(b.due)+'</span>':'<span class="tag g">'+t("paidS")+'</span>')+'</td>'+
    '<td style="white-space:nowrap"><button class="btn ghost sm" data-hp="'+b.no+'"><svg><use href="#i-print"/></svg></button> <button class="btn wa sm" data-hw="'+b.no+'"><svg><use href="#i-wa"/></svg></button> <button class="btn red sm" data-hd="'+b.no+'"><svg><use href="#i-trash"/></svg></button></td></tr>'}).join("")||'<tr><td colspan="6" class="empty">—</td></tr>';
  $("histInfo").innerHTML=t("billsN")+': <b class="num">'+list.length+'</b> · '+t("sum")+': <b class="num">'+money(sum)+'</b> · '+t("due")+': <b class="num">'+money(due)+'</b> '+(list.length>300?t("shown300"):"")}
function billBy(no){for(var i=0;i<db.bills.length;i++)if(db.bills[i].no===+no)return db.bills[i]}
$("histTbl").onclick=function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.hp)printBill(billBy(b.dataset.hp));
  if(b.dataset.hw){var x=billBy(b.dataset.hw);sendWA(x.cPhone,billText(x))}
  if(b.dataset.hd&&confirm(t("confirmDel"))){db.bills=db.bills.filter(function(x){return x.no!==+b.dataset.hd});save();renderHist();renderHeader()}};

/* ======================= REPORT ======================= */
function renderRep(){var now=new Date(),td=day(now),ym=td.slice(0,7);
  var T={sales:0,bills:0,cash:0,digital:0,rec:0,recCash:0,due:0,exp:0},M={sales:0,bills:0,exp:0},items={},days={};
  for(var k=6;k>=0;k--){var d=new Date(now);d.setDate(d.getDate()-k);days[day(d)]={c:0,s:0,e:0}}
  db.bills.forEach(function(b){var d=day(b.date);
    if(d===td){T.sales+=b.net;T.bills++;T.due+=r2(b.net-b.paid0);if(b.mk==="cash"||b.mk==="credit")T.cash+=b.paid0;else T.digital+=b.paid0}
    if(d.slice(0,7)===ym){M.sales+=b.net;M.bills++;b.lines.forEach(function(l){var x=items[l.name]||(items[l.name]={q:0,a:0});x.q+=l.qty;x.a+=l.amt})}
    if(days[d]){days[d].c++;days[d].s+=b.net}
    (b.payments||[]).forEach(function(p){if(day(p.date)===td){T.rec+=p.amount}})});
  db.customers.forEach(function(c){(c.payments||[]).forEach(function(p){if(day(p.date)===td)T.rec+=p.amount})});
  db.expenses.forEach(function(x){if(x.date===td)T.exp+=x.amount;if(x.date.slice(0,7)===ym)M.exp+=x.amount;if(days[x.date])days[x.date].e+=x.amount});
  var tot=0;dueMap(function(n2,a){if(a>0)tot+=a});
  function st(l,v,c){return '<div class="stat '+(c||"")+'"><div class="muted">'+l+'</div><div class="v">'+v+'</div></div>'}
  $("todayStats").innerHTML=st(t("todaySales"),money(T.sales))+st(t("todayBills"),T.bills)+st(t("cashIn"),money(T.cash),"g")+st(t("digitalIn"),money(T.digital))+st(t("recovered"),money(T.rec),"g")+st(t("newDue"),money(T.due),"r")+st(t("todayExp"),money(T.exp),"r");
  var cashNet=T.cash+T.rec-T.exp;
  $("cashLine").innerHTML=t("cashLine").replace("{a}",'<b class="num">'+fmt(T.cash+T.rec)+'</b>').replace("{b}",'<b class="num">'+fmt(T.exp)+'</b>').replace("{c}",'<b class="num">'+money(cashNet)+'</b>');
  $("monthStats").innerHTML=st(t("monthSales"),money(M.sales))+st(t("billsN"),M.bills)+st(t("monthExp"),money(M.exp),"r")+st(t("monthProfit"),money(M.sales-M.exp),M.sales-M.exp>=0?"g":"r")+st(t("totalDue"),money(tot),"r");
  var top=Object.keys(items).map(function(k){return[k,items[k]]}).sort(function(a,b){return b[1].a-a[1].a}).slice(0,10);
  $("topTbl").tBodies[0].innerHTML=top.map(function(x){return '<tr><td>'+esc(x[0])+'</td><td class="num">'+fq(x[1].q)+'</td><td class="num">'+fmt(x[1].a)+'</td></tr>'}).join("")||'<tr><td colspan="3" class="empty">—</td></tr>';
  $("daysTbl").tBodies[0].innerHTML=Object.keys(days).reverse().map(function(d){var x=days[d];return '<tr><td class="num">'+sd(d+"T00:00")+'</td><td class="num">'+x.c+'</td><td class="num">'+fmt(x.s)+'</td><td class="num">'+fmt(x.e)+'</td></tr>'}).join("");
  var low=db.items.filter(function(i){return i.stock!=null&&i.min!=null&&i.stock<=i.min});
  $("lowList").innerHTML=low.length?'<div class="chips">'+low.map(function(i){return '<span class="tag r">'+esc(i.name)+': <span class="num">'+fq(i.stock)+'</span></span>'}).join("")+'</div>':'<p class="empty">'+t("noLow")+'</p>'}
